<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Evan Powerbuilding Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Evan Powerbuilding</h1>
      <p>4-day autoregulated strength + size tracker</p>
    </div>
    <button id="installBtn" class="ghost" hidden>Install</button>
  </header>

  <main>
    <section class="controls card">
      <div class="control-group">
        <label for="daySelect">Training Day</label>
        <select id="daySelect"></select>
      </div>
      <div class="control-group">
        <label for="recoverySelect">Recovery / Fatigue</label>
        <select id="recoverySelect">
          <option value="primary">Fresh — Primary movements</option>
          <option value="subA">Moderate fatigue — Sub A</option>
          <option value="subB">High fatigue — Sub B</option>
        </select>
      </div>
      <button id="applyRecoveryBtn">Apply substitutions</button>
      <button id="resetDayBtn" class="ghost">Reset day</button>
    </section>

    <section id="dayHeader" class="day-header"></section>
    <section id="workoutGrid" class="workout-grid"></section>

    <section class="card session-card">
      <div class="session-meta">
        <div>
          <label for="sessionDate">Date</label>
          <input id="sessionDate" type="date" />
        </div>
        <div>
          <label for="bodyweight">Bodyweight</label>
          <input id="bodyweight" type="number" inputmode="decimal" placeholder="lb" />
        </div>
      </div>
      <label for="sessionNotes">Session notes</label>
      <textarea id="sessionNotes" rows="5" placeholder="Energy, pain, technique, substitutions, wins..."></textarea>
      <div class="actions">
        <button id="saveWorkoutBtn">Save workout</button>
        <button id="clearInputsBtn" class="ghost">Clear inputs</button>
      </div>
      <div id="autosaveStatus" class="autosave-status" aria-live="polite"></div>
      <div id="saveStatus" class="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="section-title-row">
        <h2>History</h2>
        <div class="actions compact">
          <button id="exportBtn" class="ghost">Export backup</button>
          <label class="file-btn ghost">Import backup<input id="importInput" type="file" accept="application/json" hidden /></label>
          <button id="clearHistoryBtn" class="danger ghost">Clear history</button>
        </div>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <footer>
    <span>Current session autosaves locally and remains available offline after the site has loaded once.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
